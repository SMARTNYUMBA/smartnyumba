# SmartNyumba Pro — Production nginx configuration
# Run: certbot --nginx -d yourdomain.com
# After certbot runs, it will auto-populate the SSL certificate paths below.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL (populated by Certbot) ────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # ── Frontend (React SPA) ─────────────────────────────────────────────
    root /var/www/smartnyumba/dist;
    index index.html;

    # Serve static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker — no cache
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React SPA — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API (proxy to Node.js) ───────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10M;
    }

    # ── Uploaded files ───────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass       http://127.0.0.1:3002/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── SSE (Server-Sent Events — keep connection alive) ─────────────────
    location /api/sse {
        proxy_pass             http://127.0.0.1:3002/api/sse;
        proxy_http_version     1.1;
        proxy_set_header       Connection "";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     86400s;
        chunked_transfer_encoding on;
    }

    # ── Logs ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/smartnyumba_access.log;
    error_log  /var/log/nginx/smartnyumba_error.log warn;
}
